# NCSA Delta. Set up with gcx and verified 2026-10-02 (docs/clusters.md).

name = "delta"
description = "NCSA Delta"
ssh_host = "login.delta.ncsa.illinois.edu"   # round-robin over 4 nodes, no public per-node names
ssh_persist = "24h"
scheduler = "slurm"
verified = "2026-10-02"
login_nodes = []                             # no public per-node names
# cron and scrontab are both disabled for users (PAM): keepalive "on-use".

transfer_collection = "7e936164-de58-4e3d-85da-21aa23c07169"   # home mapped at /~/
transfer_home = "/~/"

read_roots = ["~"]
script_roots = ["~"]
notes = "One of the round-robin nodes was seen wedged (accepts TCP, no SSH banner) on 2026-09-15; gcx login pins a healthy node."

# The CPU account (bdiu-delta-cpu) is gone as of 2026-10-01; the only funded
# account is GPU, so the test job takes one A40 for two minutes.
[test_job]
queue = "gpuA40x4-interactive"
resources = ["--ntasks=1", "--cpus-per-task=1", "--mem=4G", "--gpus-per-node=1", "--time=00:02:00"]
